version: "3"

tasks:
  install:
    desc: Install backend (uv) and frontend (npm) dependencies
    cmds:
      - uv sync
      - npm install --prefix frontend

  launch-ui:
    desc: Launch the frontend dev server
    dir: frontend
    cmds:
      - npm run dev

  launch-server:
    desc: Launch the backend FastAPI server
    cmds:
      - uv run python -m src.raphael.main

  run:
    desc: Launch the frontend and backend together
    deps:
      - launch-ui
      - launch-server

  lint:
    desc: Lint the frontend (oxlint)
    dir: frontend
    cmds:
      - npm run lint

  typecheck:
    desc: Type-check the frontend (tsc)
    dir: frontend
    cmds:
      - npx tsc --noEmit -p .

  check:
    desc: Run all lint and type checks
    deps:
      - lint
      - typecheck
