<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The clapper board from the NavBar brand, drawn as text so the browser
    renders it with the same system emoji font the page itself uses. Keeping it
    as a glyph rather than a traced/rasterised copy means the tab always
    matches the header on any given machine.
  -->
  <text
    x="50"
    y="50"
    font-size="88"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif"
  >🎬</text>
</svg>
